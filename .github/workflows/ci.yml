name: CI

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: book_review_test
      TEST_DB_NAME: book_review_test
      DB_USER: krishan
      DB_PASSWORD: testpassword
      JWT_SECRET_KEY: test-secret-key-for-ci-only-12345678901234567890
      JWT_ALGORITHM: HS256

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: krishan
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: book_review_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U krishan -d book_review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: >
          uv run pytest
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=85

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/book-review-api:latest
            ${{ steps.login-ecr.outputs.registry }}/book-review-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
